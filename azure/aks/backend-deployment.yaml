apiVersion: apps/v1
kind: Deployment
metadata:
  name: supfile-backend
  labels:
    app: supfile-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supfile-backend
  template:
    metadata:
      labels:
        app: supfile-backend
    spec:
      containers:
      - name: backend
        image: supfile/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: supfile-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: supfile-secrets
              key: secret-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: supfile-secrets
              key: jwt-secret-key
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: supfile-secrets
              key: azure-storage-connection-string
        - name: CORS_ORIGINS
          value: "https://supfile.azurefd.net"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: supfile-backend-service
spec:
  type: ClusterIP
  selector:
    app: supfile-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000

