apiVersion: apps/v1
kind: Deployment
metadata:
  name: supfile-frontend
  labels:
    app: supfile-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supfile-frontend
  template:
    metadata:
      labels:
        app: supfile-frontend
    spec:
      containers:
      - name: frontend
        image: supfile/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "https://api.supfile.azurefd.net/api/v1"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: supfile-frontend-service
spec:
  type: ClusterIP
  selector:
    app: supfile-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

