# Site Nginx pour SUPFile — écoute sur :80 (Funnel / HAProxy)
# Uvicorn écoute en local sur :8080 (systemd supfile.service)
#
# Installation :
#   sudo cp deploy/nginx-supfile.conf /etc/nginx/sites-available/supfile
#   sudo ln -sf /etc/nginx/sites-available/supfile /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream supfile_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 100M;

    location / {
        proxy_pass http://supfile_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v1/ws {
        proxy_pass http://supfile_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
